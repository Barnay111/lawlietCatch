<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BehaviorGuard — дашборд</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top" hidden>
    <div class="brand">BehaviorGuard <span class="muted">· Fraud Monitoring · Demo</span></div>
    <nav>
      <button data-tab="overview" class="tab active">Обзор</button>
      <button data-tab="assessments" class="tab">Оценки</button>
      <button data-tab="audit" class="tab" id="auditTab" hidden>Аудит</button>
    </nav>
    <div class="who">
      <span id="who"></span>
      <button id="logout" class="ghost">Выйти</button>
    </div>
  </header>

  <main>
    <section id="login" class="login card">
      <h1>Вход в дашборд</h1>
      <p class="muted">Учётные записи выдаёт администратор банка.</p>
      <form id="loginForm">
        <label>Логин <input name="username" autocomplete="username" required maxlength="64"></label>
        <label>Пароль <input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
        <button type="submit">Войти</button>
        <p id="loginError" class="error" role="alert"></p>
      </form>
    </section>

    <section id="view-overview" class="view" hidden>
      <div class="toolbar">
        <h2>Обзор</h2>
        <label>Период
          <select id="hours">
            <option value="1">1 час</option>
            <option value="24" selected>24 часа</option>
            <option value="168">7 дней</option>
          </select>
        </label>
      </div>
      <div class="cards" id="cards"></div>
      <div class="card">
        <h3>Оценки по часам</h3>
        <div id="timeline" class="timeline"></div>
        <div class="legend">
          <span class="dot LOW"></span>LOW
          <span class="dot MEDIUM"></span>MEDIUM
          <span class="dot HIGH"></span>HIGH
          <span class="dot UNKNOWN"></span>UNKNOWN
        </div>
      </div>
      <div class="card">
        <h3>Последние оценки</h3>
        <table id="recent"></table>
      </div>
    </section>

    <section id="view-assessments" class="view" hidden>
      <div class="toolbar">
        <h2>Оценки</h2>
        <label>Уровень
          <select id="levelFilter">
            <option value="">все</option>
            <option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>UNKNOWN</option>
          </select>
        </label>
      </div>
      <div class="card">
        <table id="feed"></table>
        <div class="pager">
          <button id="prev" class="ghost">Назад</button>
          <span id="pageInfo" class="muted"></span>
          <button id="next" class="ghost">Далее</button>
        </div>
      </div>
    </section>

    <section id="view-audit" class="view" hidden>
      <div class="toolbar"><h2>Журнал аудита</h2></div>
      <div class="card"><table id="auditTable"></table></div>
    </section>

    <dialog id="detail">
      <div class="dialog-head">
        <h2>Сессия</h2>
        <button id="closeDetail" class="ghost">Закрыть</button>
      </div>
      <div id="detailBody"></div>
    </dialog>
  </main>

  <script src="app.js"></script>
</body>
</html>
