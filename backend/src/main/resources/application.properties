spring.application.name=behaviorguard-backend

# PostgreSQL (значения по умолчанию совпадают с infra/docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/behaviorguard?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:bg}
spring.datasource.password=${DB_PASSWORD:bg_dev_password}

# Миграции схемы (Flyway, файлы в src/main/resources/db/migration)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# Батчинг вставок: пакет из 40 событий уходит одним обращением к БД, а не 40 отдельными.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis: временные признаки сессий
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator: наружу отдаём только health
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ML-сервис (ml-engine). Таймаут короткий: при задержке риск возвращается как UNKNOWN, а не ждём.
behaviorguard.ml.base-url=${ML_BASE_URL:http://localhost:8000}
behaviorguard.ml.timeout-ms=1500

# Пул соединений с PostgreSQL. По умолчанию как у Hikari (10); меняется через DB_POOL_SIZE.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}

# Ограничение частоты (запросов в минуту). Логин — на IP, API — на интеграцию (организация + тип ключа).
# API-лимит 60 000/мин соответствует измеренному пределу стенда (~400 итераций/с с тремя запросами).
behaviorguard.ratelimit.login-per-minute=${RATE_LOGIN_PER_MINUTE:10}
behaviorguard.ratelimit.api-per-minute=${RATE_API_PER_MINUTE:60000}

# Cookie дашборда: Secure включаем за TLS-прокси; локально по http выключено.
behaviorguard.cookie.secure=${COOKIE_SECURE:false}

# Служебный токен для ML-сервиса (ML_SERVICE_TOKEN). Без него ML-сервис отказывает в оценке.
behaviorguard.ml.token=${ML_SERVICE_TOKEN:}

# Срок хранения сырых событий, дней (раздел 8 ТЗ). Агрегаты профилей сохраняются.
behaviorguard.retention.raw-events-days=${RAW_EVENTS_RETENTION_DAYS:90}

# IP обратных прокси, которым доверяем X-Forwarded-For (через запятую). Пусто — не доверяем никому.
behaviorguard.trusted-proxies=${TRUSTED_PROXIES:}
