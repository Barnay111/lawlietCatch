# TLS-терминация перед backend. Сертификаты выдаёт банк / Let's Encrypt; пути ниже — пример.
# Backend сам по http не отдаётся наружу: доступен только этому прокси.

server {
    listen 80;
    server_name api.example.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # OCSP stapling включается при боевом сертификате от публичного УЦ (нужен resolver и цепочка).
    server_name api.example.kz;

    ssl_certificate     /etc/tls/fullchain.pem;
    ssl_certificate_key /etc/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Только современные AEAD-наборы для TLS 1.2; TLS 1.3 использует свои (встроенные).
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:TLS:10m;

    # HSTS отдаёт приложение: один заголовок, без дублей.

    # Лимит тела на периметре (приложение ограничивает тоже: 1 МБ).
    client_max_body_size 1m;

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        # Приложение доверяет X-Forwarded-For только от адресов из TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
