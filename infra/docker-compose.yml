name: behaviorguard

# Локальная инфраструктура для разработки MVP.
# Запуск: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    container_name: bg-postgres
    environment:
      POSTGRES_DB: behaviorguard
      POSTGRES_USER: bg
      POSTGRES_PASSWORD: bg_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bg -d behaviorguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: bg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
