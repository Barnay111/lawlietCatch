name: behaviorguard

# Локальная инфраструктура для разработки MVP.
# Секреты берутся из infra/.env (файл не коммитится). Шаблон: infra/.env.example.
# Запуск: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    container_name: bg-postgres
    environment:
      POSTGRES_DB: behaviorguard
      POSTGRES_USER: bg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в infra/.env}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bg -d behaviorguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: bg-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?задайте REDIS_PASSWORD в infra/.env}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
